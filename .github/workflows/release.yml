# 发布流水线：tag 推送时自动构建 + 发布到 PyPI
# 触发：推送 v*.*.* 格式的 tag

name: Release

on:
  push:
    tags:
      - "v*.*.*"

# 发布不允许并发
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─── 发布前验证 ────────────────────────────────────
  validate:
    name: 发布前验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: 全量测试
        run: |
          python -m pytest \
            --tb=short -q \
            --cov=scheduler \
            --cov-branch \
            --cov-fail-under=80

      - name: 校验版本号一致性
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "版本号不一致: tag=$TAG_VERSION, pyproject.toml=$PKG_VERSION"
            exit 1
          fi
          echo "版本号校验通过: $TAG_VERSION"

  # ─── 构建 + 发布 ──────────────────────────────────
  publish:
    name: 发布到 PyPI
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dev-task-scheduler
    permissions:
      id-token: write  # OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装构建工具
        run: pip install build

      - name: 构建 sdist + wheel
        run: python -m build

      - name: 发布到 PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # ─── GitHub Release ────────────────────────────────
  github-release:
    name: 创建 GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
