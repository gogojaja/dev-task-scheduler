[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-task-scheduler"
version = "1.0.0"
description = "轻量、可靠、可观测的本地定时任务调度框架"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "apscheduler>=3.10.0,<4.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
dev-task-scheduler = "scheduler.cli:main"

[tool.setuptools.packages.find]
include = ["scheduler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
