[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-task-scheduler"
version = "1.0.0"
description = "轻量、可靠、可观测的本地定时任务调度框架"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["scheduler", "cron", "task", "automation", "apscheduler", "job-scheduler"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "apscheduler>=3.10.0,<4.0.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/your-org/dev-task-scheduler"
Repository = "https://github.com/your-org/dev-task-scheduler"
Issues = "https://github.com/your-org/dev-task-scheduler/issues"
Documentation = "https://github.com/your-org/dev-task-scheduler/tree/main/docs"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
    "build",
    "twine",
    "pip-audit",
]

[project.scripts]
dev-task-scheduler = "scheduler.cli:main"

[tool.setuptools.packages.find]
include = ["scheduler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["scheduler"]
branch = true
omit = [
    "scheduler/tasks/*",
    "scheduler/cli.py",
    "scheduler/scheduler.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "pass",
]

[tool.coverage.html]
directory = "htmlcov"

# ─── Ruff 代码检查配置 ─────────────────────────────

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in default argument (common in FastAPI/typer)
]

[tool.ruff.lint.isort]
known-first-party = ["scheduler"]
